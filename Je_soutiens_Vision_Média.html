<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Je soutiens Vision Média</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F4B;--navy2:#13306E;--orange:#F7941D;--white:#fff;--green:#128C4A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--navy)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--navy),var(--navy2));color:var(--white);
font-family:Poppins,'Segoe UI',Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:28px 20px 40px}
.badge{width:96px;height:96px;border-radius:24px;background:#fff;padding:6px;display:block;margin:8px auto 24px}
.badge img{width:100%;height:100%;object-fit:contain;display:block}
h1{font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1.15;margin:0 0 14px;text-align:center}
.lead{margin:0 auto 28px;text-align:center;color:#d6def0;max-width:38ch}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:0 20px;border:2px solid transparent;
border-radius:16px;font:800 17px/1.2 Poppins,Arial,sans-serif;cursor:pointer;text-align:center;color:inherit;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,input:focus-visible,.seg button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.primary{background:var(--orange);color:var(--navy)}
.ghost{background:transparent;border-color:rgba(255,255,255,.55)}
.addwrap{position:relative}
.addwrap input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.addwrap:focus-within .btn{outline:3px solid #fff;outline-offset:3px}
.wa{background:var(--green);color:#fff}
.privacy{text-align:center;color:#b9c6e3;font-size:14px;margin:18px 0 0}
#editor{margin-top:8px;animation:pop .5s ease both}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#editor{animation:none}.btn{transition:none}}
#cv{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.45);touch-action:none;cursor:grab;background:var(--navy)}
.hint{text-align:center;color:#b9c6e3;font-size:14px;margin:10px 0 18px}
.seg{display:flex;gap:8px;margin-bottom:18px}
.seg button{flex:1;min-height:48px;border-radius:14px;border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;font:600 15px Poppins,Arial,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);border-color:#fff}
label.f{display:block;font-weight:600;font-size:15px;margin:0 0 6px}
input[type=text]{width:100%;min-height:52px;border-radius:14px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;padding:0 16px;font:500 16px Poppins,Arial,sans-serif;margin-bottom:18px}
input[type=text]::placeholder{color:#a9b8d9}
input[type=range]{width:100%;accent-color:var(--orange);margin:6px 0 18px;height:32px}
.actions{display:grid;gap:12px;margin-top:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <section id="home">
    <div class="badge"><img id="homeLogo" alt="Logo Vision Média"></div>
    <h1>Soutiens Vision Média en 30 secondes</h1>
    <p class="lead">Ajoute ta photo, personnalise ton visuel et partage-le pour faire connaître la chaîne.</p>
    <div class="addwrap"><span class="btn primary">Ajouter ma photo</span><input class="pick" type="file" accept="image/*" aria-label="Ajouter ma photo"></div>
    <p class="privacy">Ta photo reste sur ton appareil.</p>
  </section>

  

  <section id="editor" hidden>
    <canvas id="cv" width="1080" height="1440" aria-label="Aperçu de ton visuel de soutien"></canvas>
    <p class="hint">Glisse la photo pour la déplacer.</p>
    <div class="seg" role="group" aria-label="Format du visuel">
      <button type="button" id="fSq" aria-pressed="true">Portrait 3:4 · 1080×1440</button>
      <button type="button" id="fSt" aria-pressed="false">Story 1080×1920</button>
    </div>
    <label class="f" for="zoom">Zoom</label>
    <input id="zoom" type="range" min="1" max="3" step="0.01" value="1">
    <label class="f" for="name">Ton prénom (facultatif)</label>
    <input id="name" type="text" maxlength="24" placeholder="Ex. Marie" autocomplete="given-name">
    <div class="actions">
      <button class="btn primary" id="dl" type="button">Télécharger mon visuel</button>
      <button class="btn wa" id="wa" type="button">Partager sur WhatsApp</button>
      <div class="addwrap"><span class="btn ghost">Changer la photo</span><input class="pick" type="file" accept="image/*" aria-label="Changer la photo"></div>
    </div>
    <p class="privacy">Ta photo reste sur ton appareil.</p>
  </section>
</main>

const L={
  sq:{H:1440,t1:90,t2:172,cy:640,r:360,nm:0,inf:1110,gap:46,fs:31,bar:1290},
  st:{H:1920,t1:200,t2:322,cy:840,r:410,nm:0,inf:1385,gap:75,fs:44,bar:1560}
};
const ITEMS=['Lancement officiel : 25 octobre 2026','Podcasts · Débats · Finances'];

function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function yt(x,y,w,h){ctx.fillStyle='#fff';rr(x,y,w,h,h*.3);ctx.fill();ctx.fillStyle='#E50914';ctx.beginPath();ctx.moveTo(x+w*.4,y+h*.25);ctx.lineTo(x+w*.4,y+h*.75);ctx.lineTo(x+w*.68,y+h*.5);ctx.closePath();ctx.fill()}
function bell(cx,cy,s,col){ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-9,6);ctx.quadraticCurveTo(-7,4,-7,-2);ctx.bezierCurveTo(-7,-10,7,-10,7,-2);ctx.quadraticCurveTo(7,4,9,6);ctx.closePath();ctx.fill();ctx.beginPath();ctx.arc(0,9,2.6,0,Math.PI);ctx.fill();ctx.beginPath();ctx.arc(0,-9.5,1.8,0,7);ctx.fill();ctx.restore()}

function draw(){
  const l=story?L.st:L.sq,W=1080,H=l.H;
  if(cv.height!==H)cv.height=H;
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0B1F4B');g.addColorStop(1,'#13306E');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#F7941D';ctx.globalAlpha=.18;
  ctx.beginPath();ctx.arc(W+30,-20,240,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(-50,H-330,270,0,7);ctx.fill();
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#fff';ctx.font='600 '+(story?52:40)+'px '+F;
  ctx.fillText('JE SOUTIENS LA CHAÎNE YOUTUBE',W/2,l.t1,960);
  ctx.fillStyle='#F7941D';ctx.font='800 '+(story?112:92)+'px '+F;
  ctx.fillText('VISION MÉDIA',W/2,l.t2,960);

  const cx=W/2,cy=l.cy,r=l.r;
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();
  ctx.fillStyle='#0B1F4B';ctx.fillRect(cx-r,cy-r,2*r,2*r);
  if(img){
    const b=Math.max(2*r/img.width,2*r/img.height)*zoom,w=img.width*b,h=img.height*b;
    const mx=(w-2*r)/2,my=(h-2*r)/2;
    ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy));
    ctx.drawImage(img,cx-w/2+ox,cy-h/2+oy,w,h);
  }
  ctx.restore();
  ctx.lineWidth=12;ctx.strokeStyle='#F7941D';ctx.beginPath();ctx.arc(cx,cy,r+8,0,7);ctx.stroke();

  if(nm){const h=story?96:68,py=l.cy+l.r+8-h/2;ctx.font='800 '+(story?58:44)+'px '+F;const w=Math.min(ctx.measureText(nm).width+(story?90:70),900);ctx.fillStyle='#F7941D';rr(W/2-w/2,py,w,h,h/2);ctx.fill();ctx.fillStyle='#0B1F4B';ctx.fillText(nm,W/2,py+h/2+2,w-40)}

  ctx.textAlign='center';ctx.font='600 '+l.fs+'px '+F;
  ITEMS.forEach((t,i)=>{
    ctx.fillStyle=i?'#F7941D':'#fff';ctx.fillText(t,W/2,l.inf+i*l.gap,960);
  });

  const bh=H-l.bar;
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,l.bar,W,bh);
  const sz=story?210:110,ly=l.bar+bh/2-sz/2;
  ctx.fillStyle='#fff';rr(44,ly,sz,sz,18);ctx.fill();
  if(logo.complete&&logo.naturalWidth)ctx.drawImage(logo,48,ly+4,sz-8,sz-8);
  const k=story?1.2:1,x0=44+sz+34,ty=l.bar+(story?105:34),by=l.bar+(story?238:104);
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='800 '+(story?46:36)+'px '+F;
  ctx.fillText('Abonne-toi, toi aussi !',x0,ty,1036-x0);
  const bw=270*k,bth=62*k;
  ctx.fillStyle='#E50914';rr(x0,by-bth/2,bw,bth,16*k);ctx.fill();
  yt(x0+16*k,by-15.5*k,44*k,31*k);
  ctx.fillStyle='#fff';ctx.font='800 '+(26*k)+'px '+F;ctx.fillText('S’ABONNER',x0+72*k,by+1,bw-80*k);
  const bx=x0+bw+52*k,tx=bx+30*k+14;
  ctx.fillStyle='#F7941D';ctx.beginPath();ctx.arc(bx,by,30*k,0,7);ctx.fill();
  bell(bx,by,1.5*k,'#0B1F4B');
  ctx.fillStyle='#fff';ctx.font='600 '+(story?27:24)+'px '+F;
  ctx.fillText('Clique sur la cloche',tx,by-14*k,1036-tx);
  ctx.fillText('de notification',tx,by+14*k,1036-tx);
}

/* Photo */
document.querySelectorAll('.pick').forEach(inp=>inp.addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;e.target.value='';
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{img=im;zoom=1;ox=oy=0;$('#zoom').value=1;
    $('#home').hidden=true;$('#editor').hidden=false;draw();window.scrollTo(0,0);URL.revokeObjectURL(u)};
  im.onerror=()=>alert('Cette image n’a pas pu être lue. Choisis une photo JPG ou PNG.');
  im.src=u;
}));



/* Cadrage */
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;const k=cv.width/cv.getBoundingClientRect().width;
  ox=drag.ox+(e.clientX-drag.x)*k;oy=drag.oy+(e.clientY-drag.y)*k;draw();
});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{drag=null;cv.style.cursor='grab'}));
$('#zoom').addEventListener('input',e=>{zoom=+e.target.value;draw()});
$('#name').addEventListener('input',e=>{nm=e.target.value.trim();draw()});
function setFmt(s){story=s;$('#fSq').setAttribute('aria-pressed',!s);$('#fSt').setAttribute('aria-pressed',s);draw()}
$('#fSq').onclick=()=>setFmt(false);$('#fSt').onclick=()=>setFmt(true);

/* Export */
const TXT='Je soutiens la chaîne YouTube Vision Média 🎙️\nLancement officiel le 25 octobre 2026 : podcasts, débats et finances.\nAbonne-toi et active la cloche 🔔';
function getFile(){return new Promise(r=>cv.toBlob(b=>r(new File([b],'je-soutiens-vision-media.png',{type:'image/png'})),'image/png'))}
$('#dl').addEventListener('click',async()=>{
  const f=await getFile();
  if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
});
$('#wa').addEventListener('click',async()=>{
  const f=await getFile();
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],text:TXT});return}catch(e){if(e.name==='AbortError')return}
  }
  window.open('https://wa.me/?text='+encodeURIComponent(TXT),'_blank');
});

(document.fonts?Promise.all([document.fonts.load('800 40px Poppins'),document.fonts.load('600 30px Poppins')]):Promise.resolve())
  .catch(()=>{}).then(draw);
draw();
</script>
